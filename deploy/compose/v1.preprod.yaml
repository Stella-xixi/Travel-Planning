# Overlay for a single-node pre-production evaluation stack. It deliberately
# disables all development identity injection and requires the built-in Web BFF
# OIDC Authorization Code + PKCE configuration.
services:
  api:
    environment:
      ENVIRONMENT: staging
      TRAVEL_PLANNING_V1_DEV_AUTH: "0"
      TRAVEL_PLANNING_V1_DEV_BFF_SECRET: ""
      TRAVEL_PLANNING_OIDC_ISSUER: ${TRAVEL_PLANNING_OIDC_ISSUER:?Set TRAVEL_PLANNING_OIDC_ISSUER}
      TRAVEL_PLANNING_OIDC_AUDIENCE: ${TRAVEL_PLANNING_OIDC_AUDIENCE:?Set TRAVEL_PLANNING_OIDC_AUDIENCE}
      TRAVEL_PLANNING_OIDC_JWKS_URL: ${TRAVEL_PLANNING_OIDC_JWKS_URL:?Set TRAVEL_PLANNING_OIDC_JWKS_URL}
      TRAVEL_PLANNING_OIDC_ALGORITHMS: ${TRAVEL_PLANNING_OIDC_ALGORITHMS:-RS256,ES256}
  run-worker:
    environment:
      ENVIRONMENT: staging
  outbox-dispatcher:
    environment:
      ENVIRONMENT: staging
  web:
    environment:
      TRAVEL_PLANNING_DEPLOYMENT_ENV: staging
      TRAVEL_PLANNING_PUBLIC_ORIGIN: ${TRAVEL_PLANNING_PUBLIC_ORIGIN:?Set the HTTPS TRAVEL_PLANNING_PUBLIC_ORIGIN}
      TRAVEL_PLANNING_BFF_DEV_AUTH: "0"
      TRAVEL_PLANNING_V1_DEV_BFF_SECRET: ""
      TRAVEL_PLANNING_ACCESS_TOKEN_COOKIE_NAME: __Host-travel_planning_access_token
      TRAVEL_PLANNING_OIDC_ISSUER: ${TRAVEL_PLANNING_OIDC_ISSUER:?Set TRAVEL_PLANNING_OIDC_ISSUER}
      TRAVEL_PLANNING_OIDC_AUTHORIZATION_URL: ${TRAVEL_PLANNING_OIDC_AUTHORIZATION_URL:?Set the explicit OIDC authorization URL}
      TRAVEL_PLANNING_OIDC_TOKEN_URL: ${TRAVEL_PLANNING_OIDC_TOKEN_URL:?Set the explicit OIDC token URL}
      TRAVEL_PLANNING_OIDC_END_SESSION_URL: ${TRAVEL_PLANNING_OIDC_END_SESSION_URL:?Set the explicit OIDC end-session URL}
      TRAVEL_PLANNING_OIDC_JWKS_URL: ${TRAVEL_PLANNING_OIDC_JWKS_URL:?Set the explicit OIDC JWKS URL}
      TRAVEL_PLANNING_OIDC_CLIENT_ID: ${TRAVEL_PLANNING_OIDC_CLIENT_ID:?Set TRAVEL_PLANNING_OIDC_CLIENT_ID}
      TRAVEL_PLANNING_OIDC_CLIENT_SECRET: ${TRAVEL_PLANNING_OIDC_CLIENT_SECRET:?Set TRAVEL_PLANNING_OIDC_CLIENT_SECRET}
      TRAVEL_PLANNING_OIDC_COOKIE_KEY: ${TRAVEL_PLANNING_OIDC_COOKIE_KEY:?Set a base64url-encoded 32-byte OIDC cookie key}
      TRAVEL_PLANNING_OIDC_SCOPES: ${TRAVEL_PLANNING_OIDC_SCOPES:-openid profile email offline_access}
      TRAVEL_PLANNING_OIDC_ALGORITHMS: ${TRAVEL_PLANNING_OIDC_ALGORITHMS:-RS256,ES256}
